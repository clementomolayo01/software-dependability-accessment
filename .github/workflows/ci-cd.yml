name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      run_heavy_jobs:
        description: "Run heavy jobs (mutation testing, JMH benchmarks)"
        required: false
        default: "false"

env:
  JAVA_VERSION: "17"
  MAVEN_VERSION: "3.9.5"
  DOCKER_IMAGE: url-shortener
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
        id: setup-java

      - name: Build with Maven
        run: mvn clean compile -DskipTests

      - name: Run unit tests
        run: mvn test

      - name: Run integration tests
        run: mvn verify

      - name: Generate JaCoCo coverage report
        run: mvn jacoco:report

      - name: Upload coverage reports
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./target/site/jacoco/jacoco.xml
          fail_ci_if_error: true

      - name: Check coverage threshold
        run: mvn jacoco:check

      - name: Generate SBOM (CycloneDX)
        run: mvn -DskipTests cyclonedx:makeAggregateBom

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-bom
          path: target/bom.xml

  mutation-testing:
    name: Mutation Testing (PiTest)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.run_heavy_jobs == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
        id: setup-java

      - name: Run mutation tests
        run: mvn clean test-compile org.pitest:pitest-maven:mutationCoverage

      - name: Upload mutation test reports
        uses: actions/upload-artifact@v4
        with:
          name: pitest-reports
          path: target/pit-reports/

  security-scanning:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        id: setup-java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: GitGuardian Secret Scanning
        uses: GitGuardian/ggshield-action@master
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

      - name: Debug JAVA_HOME
        run: |
          echo "setup-java.outputs.path=${{ steps.setup-java.outputs.path }}"
          echo "JAVA_HOME (runner env): $JAVA_HOME"
          echo "java -version:"
          java -version
        env:
          JAVA_HOME: ${{ steps.setup-java.outputs.path }}

      # --- Snyk fix: ensure Node.js is available and install Snyk CLI via npm ---
      - name: Set up Node.js (for Snyk)
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Snyk CLI (npm)
        run: |
          # Install only if not already present to save time on reruns
          if ! command -v snyk >/dev/null 2>&1; then
            npm install -g snyk@latest
          fi
          snyk --version
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Ensure Maven dependencies are available
        run: mvn -B -DskipTests -DskipITs package
        env:
          JAVA_HOME: ${{ steps.setup-java.outputs.path }}

      - name: Snyk Security Scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          JAVA_HOME: ${{ steps.setup-java.outputs.path }}
        run: |
          set -o pipefail
          snyk test --all-projects --severity-threshold=high || true
          snyk monitor --all-projects || true

      - name: Build and analyze (Sonar)
        if: github.event_name != 'pull_request'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          JAVA_HOME: ${{ steps.setup-java.outputs.path }}
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=naijawebmaster1_software-dependability-accessment

  docker-build:
    name: Docker Build and Push
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scanning]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}:buildcache,mode=max

  performance-benchmarks:
    name: Performance Benchmarks (JMH)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.run_heavy_jobs == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
        id: setup-java

      - name: Run JMH benchmarks
        run: mvn clean verify -DskipITs=true -Pbenchmarks

  jml-verification:
    name: JML Verification (OpenJML)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Install OpenJML
        run: |
          wget -O openjml.zip https://github.com/OpenJML/OpenJML/releases/download/0.17.0-alpha-15/openjml-ubuntu-20.04-0.17.0-alpha-15.zip
          mkdir -p openjml
          unzip -d ./openjml openjml.zip
          chmod +x openjml/openjml

      - name: Build classpath for OpenJML
        run: mvn -q -DincludeScope=compile dependency:build-classpath -Dmdep.outputFile=cp.txt

      - name: Verify JML contracts
        env:
          OPENJML: ${{ github.workspace }}/openjml/openjml
        run: |
          mvn -DskipTests compile
          CP="$(cat cp.txt):target/classes"
          $OPENJML -no-purityCheck -cp "$CP" -rac \
            src/main/java/com/urlshortener/service/UrlShortenerService.java \
            src/main/java/com/urlshortener/service/UserService.java \
            src/main/java/com/urlshortener/security/JwtTokenProvider.java
